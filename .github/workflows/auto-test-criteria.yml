name: Auto-Add Test Criteria to New Issues
on:
  issues:
    types: [opened, reopened]
  
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to add test criteria to'
        required: false
        type: string

jobs:
  add-test-criteria:
    runs-on: ubuntu-latest
    if: github.event.action == 'opened' || github.event.action == 'reopened' || github.event_name == 'workflow_dispatch'
    
    steps:
    - name: Determine test criteria type
      id: determine-type
      run: |
        REPO_NAME="${{ github.repository }}"
        ISSUE_TITLE="${{ github.event.issue.title || 'Manual trigger' }}"
        
        # Convert to lowercase for comparison
        REPO_LOWER=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]')
        TITLE_LOWER=$(echo "$ISSUE_TITLE" | tr '[:upper:]' '[:lower:]')
        
        if [[ "$REPO_LOWER" == *"api"* ]] || [[ "$TITLE_LOWER" == *"api"* ]] || [[ "$TITLE_LOWER" == *"endpoint"* ]]; then
          echo "test-type=api" >> $GITHUB_OUTPUT
        elif [[ "$REPO_LOWER" == *"front-end"* ]] || [[ "$REPO_LOWER" == *"ui"* ]] || [[ "$TITLE_LOWER" == *"ui"* ]] || [[ "$TITLE_LOWER" == *"component"* ]]; then
          echo "test-type=frontend" >> $GITHUB_OUTPUT
        elif [[ "$TITLE_LOWER" == *"model"* ]] || [[ "$TITLE_LOWER" == *"lstm"* ]] || [[ "$TITLE_LOWER" == *"forecast"* ]]; then
          echo "test-type=ml" >> $GITHUB_OUTPUT
        elif [[ "$TITLE_LOWER" == *"deploy"* ]] || [[ "$TITLE_LOWER" == *"infrastructure"* ]] || [[ "$TITLE_LOWER" == *"aws"* ]]; then
          echo "test-type=infrastructure" >> $GITHUB_OUTPUT
        elif [[ "$TITLE_LOWER" == *"security"* ]] || [[ "$TITLE_LOWER" == *"auth"* ]] || [[ "$TITLE_LOWER" == *"vulnerability"* ]]; then
          echo "test-type=security" >> $GITHUB_OUTPUT
        else
          echo "test-type=general" >> $GITHUB_OUTPUT
        fi

    - name: Add test criteria to issue
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
        ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number }}
        TEST_TYPE: ${{ steps.determine-type.outputs.test-type }}
      run: |
        # Get current issue body
        CURRENT_BODY=$(gh api repos/$REPO/issues/$ISSUE_NUMBER --jq '.body // ""')
        
        # Check if test criteria already exist
        if [[ "$CURRENT_BODY" == *"🧪 Test Criteria for Completion"* ]]; then
          echo "⏭️ Issue #$ISSUE_NUMBER already has test criteria"
          exit 0
        fi
        
        # Generate test criteria based on type
        case $TEST_TYPE in
          "api")
            TEST_CRITERIA='
        ## 🧪 Test Criteria for Completion

        ### API Tests (Required - CLAUDE.md Compliance)
        - [ ] **Endpoint Availability**: GET/POST requests return proper HTTP status codes
        - [ ] **Response Format**: JSON responses match documented schema
        - [ ] **Authentication**: Proper Auth0 JWT validation for protected endpoints
        - [ ] **Error Handling**: 4xx/5xx errors return informative error messages
        - [ ] **Load Testing**: Endpoint handles concurrent requests without timeouts

        ### Integration Tests (Required)
        - [ ] **Cross-Region**: API works in both us-east-1 and af-south-1 regions
        - [ ] **Database**: Database queries execute successfully and return valid data
        - [ ] **External Services**: Integration with weather APIs, Auth0, Stripe functions correctly

        ### Deployment Verification (Critical)
        - [ ] **US-EAST-1**: Endpoint accessible at discovered AWS API Gateway endpoints
        - [ ] **AF-SOUTH-1**: Endpoint accessible at discovered AWS API Gateway endpoints
        - [ ] **Health Checks**: /health endpoint returns 200 with system status
        - [ ] **Monitoring**: CloudWatch logs show no error patterns

        **Test Completion Required**: All checkboxes must pass before marking issue as Done.
        **Auto-generated by Ona Platform Test Criteria Automation**'
            ;;
          "frontend")
            TEST_CRITERIA='
        ## 🧪 Test Criteria for Completion

        ### Frontend Tests (Required - CLAUDE.md Compliance)
        - [ ] **Component Rendering**: UI components render correctly in different browsers
        - [ ] **User Interactions**: All buttons, forms, and interactive elements function properly
        - [ ] **Responsive Design**: Layout adapts correctly to mobile/tablet/desktop screens
        - [ ] **Auth Integration**: Login/logout flows work with Auth0 authentication
        - [ ] **Error States**: Proper error messages display for failed API calls

        ### Integration Tests (Required)
        - [ ] **API Connectivity**: Frontend successfully calls backend API endpoints
        - [ ] **Data Flow**: User actions trigger correct API calls and update UI state
        - [ ] **Payment Flow**: Stripe integration functions for subscription management (if applicable)
        - [ ] **Cross-Browser**: Testing in Chrome, Firefox, Safari, Edge

        ### Performance Tests (Required)
        - [ ] **Page Load Speed**: Initial page load under 3 seconds
        - [ ] **Bundle Size**: JavaScript bundle optimized and under size limits
        - [ ] **Memory Usage**: No memory leaks during extended usage

        **Test Completion Required**: All checkboxes must pass before marking issue as Done.
        **Auto-generated by Ona Platform Test Criteria Automation**'
            ;;
          *)
            TEST_CRITERIA='
        ## 🧪 Test Criteria for Completion

        ### Functional Tests (Required - CLAUDE.md Compliance)
        - [ ] **Core Functionality**: Main feature/fix works as described in issue
        - [ ] **Integration**: Changes integrate properly with existing systems
        - [ ] **Backward Compatibility**: Existing functionality remains unaffected
        - [ ] **Error Handling**: Edge cases and error conditions handled gracefully
        - [ ] **Documentation**: Code changes properly documented and examples provided

        ### Quality Tests (Required)
        - [ ] **Code Review**: Code meets quality standards and passes peer review
        - [ ] **Unit Tests**: Test coverage for new/modified code meets minimum requirements
        - [ ] **Performance**: Changes do not negatively impact system performance
        - [ ] **Linting**: Code passes all linting and formatting checks

        ### Deployment Tests (Required)
        - [ ] **Local Testing**: Changes work correctly in development environment
        - [ ] **Staging**: Deployment to staging environment successful
        - [ ] **Production**: Production deployment completed without issues

        **Test Completion Required**: All checkboxes must pass before marking issue as Done.
        **Auto-generated by Ona Platform Test Criteria Automation**'
            ;;
        esac
        
        # Combine current body with test criteria
        NEW_BODY="$CURRENT_BODY

        $TEST_CRITERIA"
        
        # Update issue
        echo "$NEW_BODY" | gh api repos/$REPO/issues/$ISSUE_NUMBER --method PATCH --field body=@-
        echo "✅ Successfully added $TEST_TYPE test criteria to issue #$ISSUE_NUMBER"

    - name: Comment on success
      if: github.event.action == 'opened'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh issue comment ${{ github.event.issue.number }} --body "🧪 **Automated Test Criteria Added**
        
        This issue has been automatically enhanced with **${{ steps.determine-type.outputs.test-type }}** test criteria based on CLAUDE.md compliance principles.
        
        **✅ Requirements for completion:**
        - All test checkboxes must be completed before marking as Done
        - Cross-region deployment verification required (us-east-1, af-south-1)
        - No fallbacks allowed - honest reporting of test results
        
        This ensures objective proof of completion for every issue in the Ona Power Tools Platform."