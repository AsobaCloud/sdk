# Common configuration for all workflows
# =========================================
# This file documents shared configuration patterns reused across all
# CI/CD workflows. Copy the relevant blocks into your workflow file.
#
# NOTE: GitHub Actions does not support YAML anchors across files.
# Use this file as a reference and copy blocks into individual workflows.
#
# Requirements addressed:
#   - 9.1: Dependency caching to reduce execution time
#   - 9.2: Concurrent workflow execution
#   - 10.1: Summary reports (see _reusable-summary.yml)

# ---------------------------------------------------------------------------
# GLOBAL ENVIRONMENT VARIABLES
# Copy into the top-level `env:` block of your workflow.
# ---------------------------------------------------------------------------
# env:
#   PYTHON_VERSION: "3.11"          # Default Python version
#   NODE_VERSION: "20"              # Default Node.js version
#   REPO_NAME: ${{ github.repository }}
#   BRANCH_NAME: ${{ github.ref_name }}
#   ARTIFACT_RETENTION_DAYS: 7

# ---------------------------------------------------------------------------
# DEFAULTS
# Copy into the top-level `defaults:` block of your workflow.
# ---------------------------------------------------------------------------
# defaults:
#   run:
#     shell: bash

# ---------------------------------------------------------------------------
# CONCURRENCY CONTROL  (Requirement 9.2)
# Cancels in-progress runs for the same workflow+branch when a new run starts,
# enabling concurrent execution across different branches/PRs while preventing
# redundant runs on the same ref.
# Copy into the top-level `concurrency:` block of your workflow.
# ---------------------------------------------------------------------------
# concurrency:
#   group: ${{ github.workflow }}-${{ github.ref }}
#   cancel-in-progress: true

# ---------------------------------------------------------------------------
# WORKFLOW PERMISSIONS
# Minimal permissions following the principle of least privilege.
# Copy into the top-level `permissions:` block of your workflow.
# ---------------------------------------------------------------------------
# permissions:
#   contents: read
#   issues: read
#   checks: write
#   actions: read
#   packages: read
#   pull-requests: write

# ---------------------------------------------------------------------------
# COMMON WORKFLOW TRIGGERS
# Copy into the `on:` block of your workflow and adjust paths as needed.
# ---------------------------------------------------------------------------
# on:
#   push:
#     branches:
#       - main
#       - develop
#       - 'feature/**'
#       - 'bugfix/**'
#       - 'release/**'
#     paths:
#       - 'python/**'
#       - 'javascript/**'
#       - '.github/workflows/**'
#       - '**/requirements.txt'
#       - '**/package.json'
#       - '**/pyproject.toml'
#   pull_request:
#     branches:
#       - main
#       - develop
#     paths:
#       - 'python/**'
#       - 'javascript/**'
#       - '.github/workflows/**'
#       - '**/requirements.txt'
#       - '**/package.json'
#       - '**/pyproject.toml'
#   workflow_dispatch:
#     inputs:
#       reason:
#         description: 'Reason for manual trigger'
#         required: false
#         default: 'Manual execution'
#         type: string

# ---------------------------------------------------------------------------
# PYTHON DEPENDENCY CACHE  (Requirement 9.1)
# Add this step after `actions/setup-python` in your workflow.
# The cache key includes the OS, Python version, and a hash of dependency
# files so the cache is invalidated when dependencies change.
# ---------------------------------------------------------------------------
# - name: Cache Python dependencies
#   uses: actions/cache@v4
#   with:
#     path: |
#       ~/.cache/pip
#       ~/.local/share/virtualenvs
#       python/.pytest_cache
#     key: ${{ runner.os }}-python-${{ matrix.python-version || env.PYTHON_VERSION }}-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
#     restore-keys: |
#       ${{ runner.os }}-python-${{ matrix.python-version || env.PYTHON_VERSION }}-
#       ${{ runner.os }}-python-

# ---------------------------------------------------------------------------
# NODE.JS DEPENDENCY CACHE  (Requirement 9.1)
# Add this step after `actions/setup-node` in your workflow.
# The cache key includes the OS, Node version, and a hash of package-lock.json
# so the cache is invalidated when dependencies change.
# ---------------------------------------------------------------------------
# - name: Cache Node.js dependencies
#   uses: actions/cache@v4
#   with:
#     path: |
#       javascript/node_modules
#       ~/.npm
#       ~/.cache/jest
#     key: ${{ runner.os }}-node-${{ matrix.node-version || env.NODE_VERSION }}-${{ hashFiles('**/package-lock.json') }}
#     restore-keys: |
#       ${{ runner.os }}-node-${{ matrix.node-version || env.NODE_VERSION }}-
#       ${{ runner.os }}-node-

