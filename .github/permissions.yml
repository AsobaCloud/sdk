# GitHub Actions Permissions Configuration
# This file defines the permissions for GitHub Actions workflows

# Default permissions for all workflows
default_permissions:
  # Repository contents
  contents: read
  # Issues and pull requests
  issues: read
  pull-requests: read
  # Checks and statuses
  checks: write
  statuses: write
  # Actions
  actions: read
  # Packages
  packages: read
  # Security events
  security-events: read
  # Discussions
  discussions: read

# Workflow-specific permissions
workflow_permissions:
  # Python CI/CD workflow
  python-ci:
    contents: read
    packages: read
    checks: write
    actions: read
  
  # JavaScript CI/CD workflow
  javascript-ci:
    contents: read
    packages: read
    checks: write
    actions: read
  
  # Integration testing workflow
  integration-ci:
    contents: read
    packages: read
    checks: write
    actions: read
  
  # Security scanning workflow
  security-ci:
    contents: read
    packages: read
    checks: write
    actions: read
    security-events: write
  
  # Performance monitoring workflow
  performance-ci:
    contents: read
    packages: read
    checks: write
    actions: read
  
  # Documentation validation workflow
  docs-ci:
    contents: read
    checks: write
    actions: read
  
  # Pull request validation workflow
  pr-validation:
    contents: read
    pull-requests: write
    checks: write
    actions: read

# Environment-specific permissions
environment_permissions:
  # Development environment
  development:
    contents: read
    packages: read
    checks: write
    actions: read
  
  # Staging environment
  staging:
    contents: read
    packages: read
    checks: write
    actions: read
    deployments: write
  
  # Production environment
  production:
    contents: read
    packages: read
    checks: write
    actions: read
    deployments: write

# Branch protection rules integration
branch_protection:
  # Main branch protection
  main:
    required_status_checks:
      # Required workflows
      contexts:
        - "python-ci"
        - "javascript-ci"
        - "integration-ci"
        - "security-ci"
        - "pr-validation"
    required_pull_request_reviews:
      required_approving_review_count: 1
      dismiss_stale_reviews: true
      require_code_owner_reviews: false
    restrictions:
      # Allow specific teams/people to push
      teams: []
      users: []
    enforce_admins: false
    required_linear_history: true
    allow_force_pushes: false
    allow_deletions: false
  
  # Develop branch protection
  develop:
    required_status_checks:
      contexts:
        - "python-ci"
        - "javascript-ci"
        - "integration-ci"
    required_pull_request_reviews:
      required_approving_review_count: 1
    enforce_admins: false
    allow_force_pushes: false

# Secret management
secrets:
  # Required secrets for workflows
  required:
    - GITHUB_TOKEN  # Auto-generated by GitHub
  
  # Optional secrets (for advanced features)
  optional:
    - SLACK_WEBHOOK_URL  # For Slack notifications
    - SNYK_TOKEN  # For Snyk security scanning
    - CODECOV_TOKEN  # For code coverage reporting
  
  # Environment-specific secrets
  environments:
    development:
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_REGION
    
    staging:
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_REGION
    
    production:
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_REGION

# Rate limiting configuration
rate_limiting:
  # Maximum concurrent workflows
  max_concurrent_workflows: 10
  
  # Maximum concurrent jobs per workflow
  max_concurrent_jobs_per_workflow: 5
  
  # Queue timeout (minutes)
  queue_timeout_minutes: 30
  
  # Job timeout (minutes)
  job_timeout_minutes: 60

# Cache configuration
cache:
  # Cache expiration (days)
  expiration_days: 7
  
  # Maximum cache size (MB)
  max_size_mb: 1024
  
  # Cache paths
  paths:
    python:
      - "~/.cache/pip"
      - "~/.local/share/virtualenvs"
      - "python/.pytest_cache"
    
    javascript:
      - "javascript/node_modules"
      - "~/.npm"
      - "~/.cache/jest"
    
    general:
      - "~/.cache"
      - "/tmp/gh-actions"

# Artifact management
artifacts:
  # Default retention period (days)
  retention_days: 7
  
  # Maximum artifact size (MB)
  max_size_mb: 500
  
  # Artifact types to retain
  retain_types:
    - "test-reports"
    - "coverage-reports"
    - "security-reports"
    - "performance-reports"
    - "documentation-reports"
  
  # Artifact types to compress
  compress_types:
    - "logs"
    - "test-results"
    - "coverage-data"

# Notification configuration
notifications:
  # Default notification channels
  channels:
    - "github"  # GitHub notifications
  
  # Optional notification channels
  optional_channels:
    - "slack"
    - "email"
    - "webhook"
  
  # Notification triggers
  triggers:
    on_failure: true
    on_success: false  # Only on first success after failure
    on_cancellation: false
    on_timeout: true
  
  # Notification content
  content:
    include_workflow_name: true
    include_job_name: true
    include_error_details: true
    include_artifact_links: true
    include_retry_instructions: true

# Security configuration
security:
  # Code scanning
  code_scanning:
    enabled: true
    tools:
      - "CodeQL"
      - "ESLint Security"
      - "Bandit"
    
    # Scan frequency
    schedule: "weekly"
    on_push: true
    on_pull_request: true
  
  # Secret scanning
  secret_scanning:
    enabled: true
    patterns:
      - "AWS_ACCESS_KEY_ID"
      - "AWS_SECRET_ACCESS_KEY"
      - "GITHUB_TOKEN"
      - "SLACK_WEBHOOK_URL"
      - "SNYK_TOKEN"
    
    # Pre-commit hooks
    pre_commit: true
    pre_push: true
  
  # Dependency scanning
  dependency_scanning:
    enabled: true
    tools:
      python:
        - "Safety"
        - "pip-audit"
      
      javascript:
        - "npm audit"
        - "Snyk"
    
    # Scan frequency
    schedule: "daily"
    on_push: true

# Monitoring and observability
monitoring:
  # Workflow metrics
  metrics:
    - "workflow_duration"
    - "job_duration"
    - "queue_time"
    - "success_rate"
    - "failure_rate"
  
  # Alerting thresholds
  thresholds:
    workflow_duration_minutes: 60
    job_duration_minutes: 30
    queue_time_minutes: 10
    failure_rate_percent: 10
  
  # Dashboard integration
  dashboards:
    - "GitHub Actions"
    - "Custom monitoring"
  
  # Log retention
  log_retention_days: 30

# Compliance and governance
compliance:
  # Required approvals
  required_approvals:
    security_changes: 2
    infrastructure_changes: 2
    breaking_changes: 2
  
  # Audit logging
  audit_logging:
    enabled: true
    retention_days: 90
  
  # Change management
  change_management:
    require_ticket: true
    ticket_types:
      - "feature"
      - "bugfix"
      - "security"
      - "infrastructure"
    
    # Minimum ticket information
    ticket_requirements:
      - "description"
      - "impact_analysis"
      - "rollback_plan"
      - "test_plan"

# Documentation
documentation:
  # Required documentation
  required:
    - "README.md"
    - "CONTRIBUTING.md"
    - "CODE_OF_CONDUCT.md"
    - "SECURITY.md"
  
  # Workflow documentation
  workflow_docs:
    location: ".github/workflows/README.md"
    required_sections:
      - "Purpose"
      - "Triggers"
      - "Jobs"
      - "Outputs"
      - "Troubleshooting"
  
  # Configuration documentation
  config_docs:
    location: ".github/CONFIGURATION.md"
    required_sections:
      - "Permissions"
      - "Secrets"
      - "Environments"
      - "Branch Protection"
      - "Rate Limiting"

# Maintenance and cleanup
maintenance:
  # Scheduled cleanup
  schedule: "weekly"
  
  # Cleanup tasks
  tasks:
    - "expired_cache"
    - "old_artifacts"
    - "stale_workflows"
    - "temporary_files"
  
  # Retention policies
  retention:
    cache_days: 7
    artifact_days: 7
    log_days: 30
    workflow_run_days: 90