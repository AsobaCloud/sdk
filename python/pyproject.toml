[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asoba"
version = "1.0.1"
description = "Python SDK for the Asoba Energy Management Platform"
readme = "README.md"
authors = [
    {name = "Asoba", email = "support@asoba.co"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.8"
dependencies = [
    "boto3>=1.28.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/AsobaCloud/sdk"
Documentation = "https://github.com/AsobaCloud/sdk/tree/main/python"
Repository = "https://github.com/AsobaCloud/sdk"

[tool.setuptools.packages.find]
where = ["."]
include = ["asoba*", "ona_platform*"]
exclude = ["tests*", "examples*"]

[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "RUF",   # ruff-specific
    "PIE",   # flake8-pie
    "SIM",   # flake8-simplify
    "TRY",   # tryceratops
    "FA",    # flake8-future-annotations
    "BLE",   # flake8-blind-except
    "DTZ",   # flake8-datetimez
    "EXE",   # flake8-executable
]
ignore = [
    "E501",    # line too long (handled by formatter)
    "TRY003",  # long messages in raise
    "TRY300",  # return in else block — deferred
    "TRY203",  # useless re-raise — intentional guard pattern in streaming clients
    "TRY401",  # redundant {e} in logger.exception — deferred
    "B904",    # raise from err — deferred, pre-existing in service clients
    "BLE001",  # blind except — intentional in service clients
    "DTZ",     # datetime timezone — deferred to future cleanup
    "SIM115",  # context manager for open — deferred
    "EXE001",  # shebang not executable — example scripts
    "RUF043",  # pytest match= metacharacters — pre-existing test patterns
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["DTZ001", "DTZ003", "DTZ005", "DTZ007", "DTZ011"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "default::DeprecationWarning:ona_platform",
]
